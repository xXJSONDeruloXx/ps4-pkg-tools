name: Release

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build (CLI + GUI) on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake qt6-base-dev

      - name: Install dependencies (macOS)
        if: runner.os == 'macOS'
        run: |
          brew update
          brew install cmake qt@6 || true

      - name: Build
        run: |
          make release

      - name: Package binaries
        run: |
          mkdir -p dist
          cp build/ps4-pkg-tool dist/ || true
          if [ -f build/ps4-pkg-tool-gui ]; then cp build/ps4-pkg-tool-gui dist/; fi
          cd dist
          tar -czf ../ps4-pkg-tools-${{ runner.os }}.tar.gz *
          cd ..

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ps4-pkg-tools-${{ runner.os }}
          path: ps4-pkg-tools-${{ runner.os }}.tar.gz

  release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository (for tagging)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate unique timestamp tag
        id: gen_tag
        run: |
          DATE=$(date -u +'%Y%m%d-%H%M%S')
          # Capture previous tag (if any) before creating the new one
          PREV_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "")
          SHORT_SHA=$(git rev-parse --short HEAD)
          TAG="v${DATE}-${SHORT_SHA}"
          echo "Generated tag: $TAG (previous tag: ${PREV_TAG:-none})"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG" -m "Automated release $TAG"
          git push origin "$TAG"

          # Generate release notes body
          if [ -n "$PREV_TAG" ]; then
            echo "Changes since $PREV_TAG:" > RELEASE_BODY.md
            git log --pretty=format:'- %s (%h)' ${PREV_TAG}..HEAD >> RELEASE_BODY.md
          else
            echo "Initial automated release." > RELEASE_BODY.md
            git log --pretty=format:'- %s (%h)' >> RELEASE_BODY.md || true
          fi
          echo "" >> RELEASE_BODY.md
          echo "Full commit range: ${PREV_TAG:-<none>}..$TAG" >> RELEASE_BODY.md

          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "body_path=RELEASE_BODY.md" >> "$GITHUB_OUTPUT"

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create Release
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          files: |
            artifacts/*/*.tar.gz
          draft: false
          prerelease: false
          tag_name: ${{ steps.gen_tag.outputs.tag }}
          name: Release ${{ steps.gen_tag.outputs.tag }}
          body_path: ${{ steps.gen_tag.outputs.body_path }}